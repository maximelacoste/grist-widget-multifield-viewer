<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multifield Viewer — Grist widget</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f5f4;
      --surface:      #ffffff;
      --border:       #e4e4e2;
      --border-strong:#c8c8c5;
      --text:         #18181b;
      --muted:        #71717a;
      --accent:       #2563eb;
      --hover:        #f0f6ff;
      --focus-ring:   0 0 0 2px rgba(37,99,235,.35);
      --radius:       5px;
      --font:         'IBM Plex Sans', system-ui, sans-serif;
      --mono:         'IBM Plex Mono', monospace;
    }

    html, body { margin: 0; padding: 0; height: 0; overflow: hidden; background: var(--bg); }

    #app {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; overflow: hidden;
      font-family: var(--font); color: var(--text); font-size: 13px; line-height: 1.5;
      background: var(--surface);
    }

    /* ── Barre d'onglets ── */
    .tabs-bar {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px;
      padding: 6px 8px 0; border-bottom: 1px solid var(--border);
      background: var(--bg); flex-shrink: 0;
    }

    .tab-btn {
      font-family: var(--font); font-size: 13px; font-weight: 500;
      padding: 4px 10px 5px; border: 1px solid var(--border-strong);
      border-bottom: none; border-radius: var(--radius) var(--radius) 0 0;
      background: var(--bg); color: var(--muted); cursor: pointer; outline: none;
      transition: background .1s, color .1s; white-space: nowrap;
      position: relative; top: 1px; max-width: 160px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .tab-btn:hover  { background: var(--hover); color: var(--text); }
    .tab-btn.active { background: var(--surface); color: var(--text); border-color: var(--border); border-bottom-color: var(--surface); z-index: 1; }
    .tab-btn.tab-empty { opacity: .4; }
    .tab-btn:focus-visible { box-shadow: var(--focus-ring); }

    .tab-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      margin-right: 5px; flex-shrink: 0;
      vertical-align: middle; position: relative; top: -1px;
    }

    /* Roue ⚙️ intégrée dans la barre */
    .btn-settings-tab {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; flex-shrink: 0;
      border: 1px solid transparent; border-radius: var(--radius);
      background: none; cursor: pointer; outline: none; color: var(--muted);
      transition: background .1s, color .1s, border-color .1s;
      position: relative; top: 1px; margin-left: 2px;
    }
    .btn-settings-tab:hover  { background: var(--hover); border-color: var(--border-strong); color: var(--text); }
    .btn-settings-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-settings-tab:focus-visible { box-shadow: var(--focus-ring); }

    /* ── Panneau réglages ── */
    .settings-panel {
      display: none; flex-direction: column; gap: 12px; padding: 10px 14px;
      background: var(--surface); border-bottom: 2px solid var(--accent);
      flex-shrink: 0; max-height: 55vh; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--border-strong) var(--bg);
    }
    .settings-panel.open { display: flex; }

    .setting-section-title {
      font-size: 10px; font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
    }

    /* Tags colonnes exclues */
    .excl-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .excl-tag {
      font-family: var(--mono); font-size: 10px; padding: 2px 7px;
      border: 1px solid var(--border-strong); border-radius: 10px;
      background: var(--bg); color: var(--muted); cursor: pointer;
      transition: background .1s, color .1s; outline: none;
    }
    .excl-tag:hover { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
    .excl-tag.is-excluded { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
    .excl-tag.is-excluded:hover { background: #dcfce7; border-color: #86efac; color: #166534; }
    .excl-tag:focus-visible { box-shadow: var(--focus-ring); }

    /* Liste champs */
    .fields-list { display: flex; flex-direction: column; gap: 3px; }
    .field-cfg-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .field-cfg-row input[type="checkbox"] {
      accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; flex-shrink: 0;
    }
    .field-cfg-handle { color: var(--muted); cursor: grab; font-size: 11px; flex-shrink: 0; user-select: none; }
    .field-cfg-colname {
      font-family: var(--mono); font-size: 10px; color: var(--muted);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .field-cfg-label {
      font-family: var(--font); font-size: 11px; padding: 2px 6px;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      color: var(--text); background: var(--bg); outline: none; width: 150px; flex-shrink: 0;
    }
    .field-cfg-label:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .field-cfg-desc {
      font-family: var(--font); font-size: 11px; padding: 2px 6px;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      color: var(--text); background: var(--bg); outline: none; width: 180px; flex-shrink: 0;
    }
    .field-cfg-desc:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .field-cfg-desc::placeholder { color: var(--muted); font-style: italic; }

    .btn-small {
      font-family: var(--font); font-size: 10px; padding: 2px 7px;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      background: var(--bg); color: var(--muted); cursor: pointer; outline: none;
      white-space: nowrap; transition: background .1s, color .1s;
    }
    .btn-small:hover { color: var(--text); border-color: var(--muted); }
    .btn-small:focus-visible { box-shadow: var(--focus-ring); }

    /* Colonne titre */
    .title-select {
      font-family: var(--font); font-size: 12px; padding: 3px 7px;
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      background: var(--surface); color: var(--text); outline: none; max-width: 220px;
    }
    .title-select:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }

    /* ── Panneau texte ── */
    .tab-panel {
      flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px;
      scrollbar-width: thin; scrollbar-color: var(--border-strong) var(--bg);
    }
    .tab-panel::-webkit-scrollbar { width: 8px; }
    .tab-panel::-webkit-scrollbar-track { background: var(--bg); }
    .tab-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid var(--bg); }
    .tab-content-text  { font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
    .tab-content-empty { font-size: 12px; color: var(--muted); font-style: italic; }

    /* ── Empty state ── */
    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--muted); text-align: center; padding: 20px;
    }
    .empty svg { opacity: .2; }
    .empty-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .empty-sub   { font-size: 12px; }
  </style>
</head>
<body>
<div id="app">

  <!-- Barre d'onglets + roue inline -->
  <div class="tabs-bar" id="tabs-bar" role="tablist"></div>

  <!-- Panneau réglages (sous la barre) -->
  <div class="settings-panel" id="settings-panel">

    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:2px">
      <span style="font-size:12px;font-weight:600;color:var(--text)">🔒 Verrouiller pour les consultants</span>
      <button id="btn-lock" type="button" role="switch" aria-checked="false"
        style="font-family:var(--font);font-size:11px;padding:3px 10px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg);color:var(--muted);cursor:pointer;outline:none;transition:background .1s,color .1s,border-color .1s;">
        Non
      </button>
    </div>

    <div>
      <p class="setting-section-title">Colonne titre</p>
      <select class="title-select" id="title-col-select">
        <option value="">— aucune —</option>
      </select>
    </div>

    <div>
      <p class="setting-section-title">Colonnes exclues</p>
      <div class="excl-row" id="excl-row"></div>
    </div>

    <div>
      <p class="setting-section-title" style="display:flex;align-items:center;gap:8px">
        Champs — libellé &amp; infobulle
        <button class="btn-small" id="btn-check-all">Tout cocher</button>
        <button class="btn-small" id="btn-uncheck-all">Tout décocher</button>
      </p>
      <div style="display:grid;grid-template-columns:14px 16px 1fr 150px 180px;gap:4px 8px;align-items:center;padding:4px 0;margin-bottom:2px">
        <span></span><span></span>
        <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">colonne</span>
        <span style="font-size:10px;color:var(--muted)">libellé onglet</span>
        <span style="font-size:10px;color:var(--muted)">infobulle (survol)</span>
      </div>
      <div class="fields-list" id="fields-list"></div>
    </div>

  </div>

  <!-- Contenu -->
  <main id="content" style="flex:1;min-height:0;display:flex;flex-direction:column;"></main>

</div>
<script>
// ══════════════════════════════════════════
// I18N
// ══════════════════════════════════════════
const LANG = (navigator.language || 'fr').startsWith('fr') ? 'fr' : 'en';
const T = {
  fr: { noRecord: 'Sélectionnez un enregistrement.', noRecordSub: 'Le contenu s\'affichera ici.', noFields: 'Aucun champ visible.', noFieldsSub: 'Configurez les champs via ⚙️', emptyField: '(aucun contenu)' },
  en: { noRecord: 'Select a record.',                noRecordSub: 'Content will appear here.',    noFields: 'No visible fields.',  noFieldsSub: 'Configure fields via ⚙️',   emptyField: '(no content)' },
}[LANG];

const SYSTEM_COLS = new Set(['id', 'manualSort']);

// ══════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════
let allCols      = [];
let excludedCols = new Set();
let fields       = [];   // { col, label, desc, visible }
let titleCol     = '';
let locked       = false;
let currentRecord = null;
let activeTab    = 0;

// ══════════════════════════════════════════
// DOM
// ══════════════════════════════════════════
const tabsBar       = document.getElementById('tabs-bar');
const settingsPanel = document.getElementById('settings-panel');
const content       = document.getElementById('content');
const titleColSel   = document.getElementById('title-col-select');
const exclRow       = document.getElementById('excl-row');
const fieldsList    = document.getElementById('fields-list');

// ══════════════════════════════════════════
// INIT COLONNES
// ══════════════════════════════════════════
function initColsFromRecord(record) {
  const detected = Object.keys(record).filter(k => !SYSTEM_COLS.has(k));
  detected.forEach(col => { if (!allCols.includes(col)) allCols.push(col); });
  allCols = allCols.filter(c => detected.includes(c));
  const existingCols = new Set(fields.map(f => f.col));
  allCols.forEach(col => {
    if (!existingCols.has(col) && !excludedCols.has(col))
      fields.push({ col, label: col, desc: '', visible: true });
  });
  fields = fields.filter(f => !excludedCols.has(f.col));
}

// ══════════════════════════════════════════
// PANNEAU RÉGLAGES
// ══════════════════════════════════════════
function buildSettings() {
  // Bouton verrou
  const btnLock = document.getElementById('btn-lock');
  if (btnLock) {
    btnLock.textContent = locked ? 'Oui 🔒' : 'Non';
    btnLock.style.background   = locked ? 'var(--accent)' : 'var(--bg)';
    btnLock.style.color        = locked ? '#fff'          : 'var(--muted)';
    btnLock.style.borderColor  = locked ? 'var(--accent)' : 'var(--border-strong)';
    btnLock.setAttribute('aria-checked', String(locked));
    btnLock.onclick = () => {
      locked = !locked;
      saveOptions(); buildSettings(); renderTabs();
    };
  }
  buildTitleColSelect();
  buildExclRow();
  buildFieldsList();
}

function buildTitleColSelect() {
  titleColSel.innerHTML = '<option value="">— aucune —</option>';
  allCols.forEach(col => {
    const opt = document.createElement('option');
    opt.value = col; opt.textContent = col;
    if (col === titleCol) opt.selected = true;
    titleColSel.appendChild(opt);
  });
}
titleColSel.addEventListener('change', () => { titleCol = titleColSel.value; saveOptions(); renderTabs(); });

function buildExclRow() {
  exclRow.innerHTML = '';
  if (allCols.length === 0) { exclRow.innerHTML = '<span style="font-size:11px;color:var(--muted);font-style:italic">Aucune colonne.</span>'; return; }
  // Colonnes actives → clic pour exclure
  fields.map(f => f.col).forEach(col => {
    const tag = document.createElement('button');
    tag.type = 'button'; tag.className = 'excl-tag'; tag.textContent = col;
    tag.title = 'Cliquer pour exclure';
    tag.addEventListener('click', () => { excludedCols.add(col); fields = fields.filter(f => f.col !== col); saveOptions(); buildSettings(); renderTabs(); });
    exclRow.appendChild(tag);
  });
  // Colonnes exclues → clic pour réintégrer
  excludedCols.forEach(col => {
    const tag = document.createElement('button');
    tag.type = 'button'; tag.className = 'excl-tag is-excluded'; tag.textContent = '↩ ' + col;
    tag.title = 'Cliquer pour réintégrer';
    tag.addEventListener('click', () => { excludedCols.delete(col); if (!fields.find(f => f.col === col)) fields.push({ col, label: col, desc: '', visible: true }); saveOptions(); buildSettings(); renderTabs(); });
    exclRow.appendChild(tag);
  });
}

function buildFieldsList() {
  fieldsList.innerHTML = '';
  fields.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'field-cfg-row'; row.draggable = true; row.dataset.idx = i;
    row.style.cssText = 'display:grid;grid-template-columns:14px 16px 1fr 150px 180px;gap:4px 8px;align-items:center;';

    const chk = document.createElement('input');
    chk.type = 'checkbox'; chk.checked = f.visible;
    chk.addEventListener('change', () => { fields[i].visible = chk.checked; saveOptions(); renderTabs(); });

    const handle = document.createElement('span');
    handle.className = 'field-cfg-handle'; handle.textContent = '⠿';

    const colName = document.createElement('span');
    colName.className = 'field-cfg-colname'; colName.textContent = f.col; colName.title = f.col;

    const inpLabel = document.createElement('input');
    inpLabel.type = 'text'; inpLabel.className = 'field-cfg-label';
    inpLabel.value = f.label; inpLabel.placeholder = f.col;
    inpLabel.addEventListener('input', () => { fields[i].label = inpLabel.value || f.col; saveOptions(); renderTabs(); });
    inpLabel.addEventListener('blur',  () => {
      const newLabel = inpLabel.value.trim();
      if (newLabel && newLabel !== f.col) renameGristColumn(f.col, newLabel);
    });

    const inpDesc = document.createElement('input');
    inpDesc.type = 'text'; inpDesc.className = 'field-cfg-desc';
    inpDesc.value = f.desc || ''; inpDesc.placeholder = 'Infobulle au survol…';
    inpDesc.addEventListener('input', () => { fields[i].desc = inpDesc.value; fields[i]._descCustomized = true; saveOptions(); renderTabs(); });

    row.appendChild(chk); row.appendChild(handle); row.appendChild(colName);
    row.appendChild(inpLabel); row.appendChild(inpDesc);
    fieldsList.appendChild(row);
  });

  // Drag & drop
  let dragIdx = null;
  fieldsList.querySelectorAll('.field-cfg-row').forEach(row => {
    row.addEventListener('dragstart', e => { dragIdx = parseInt(row.dataset.idx); e.dataTransfer.effectAllowed = 'move'; row.style.opacity = '.4'; });
    row.addEventListener('dragend',   () => { row.style.opacity = ''; dragIdx = null; });
    row.addEventListener('dragover',  e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const dropIdx = parseInt(row.dataset.idx);
      if (dragIdx === null || dragIdx === dropIdx) return;
      const moved = fields.splice(dragIdx, 1)[0];
      fields.splice(dropIdx, 0, moved);
      saveOptions(); buildFieldsList(); renderTabs();
    });
  });
}

document.getElementById('btn-check-all').addEventListener('click',   () => { fields.forEach(f => f.visible = true);  saveOptions(); buildFieldsList(); renderTabs(); });
document.getElementById('btn-uncheck-all').addEventListener('click', () => { fields.forEach(f => f.visible = false); saveOptions(); buildFieldsList(); renderTabs(); });

// ══════════════════════════════════════════
// RENDU ONGLETS
// ══════════════════════════════════════════
function renderTabs() {
  tabsBar.innerHTML = '';

  if (!currentRecord) {
    content.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p class="empty-title">${T.noRecord}</p><p class="empty-sub">${T.noRecordSub}</p>
    </div>`;
    appendSettingsBtn();
    return;
  }

  const visible = fields.filter(f => f.visible);

  if (visible.length === 0) {
    content.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 21V9"/></svg>
      <p class="empty-title">${T.noFields}</p><p class="empty-sub">${T.noFieldsSub}</p>
    </div>`;
    appendSettingsBtn();
    return;
  }

  if (activeTab >= visible.length) activeTab = 0;

  // Titre dans la barre si titleCol configuré
  if (titleCol && currentRecord[titleCol]) {
    const titleEl = document.createElement('span');
    titleEl.style.cssText = 'font-size:11px;font-weight:600;color:var(--text);padding:0 6px 6px 2px;align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;';
    titleEl.textContent = toString(currentRecord[titleCol]);
    titleEl.title = toString(currentRecord[titleCol]);
    tabsBar.appendChild(titleEl);

    const sep = document.createElement('div');
    sep.style.cssText = 'width:1px;height:16px;background:var(--border);align-self:center;margin:0 4px 4px;flex-shrink:0;';
    tabsBar.appendChild(sep);
  }

  visible.forEach((f, i) => {
    const val = toString(currentRecord[f.col]);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab-btn' + (i === activeTab ? ' active' : '') + (!val ? ' tab-empty' : '');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(i === activeTab));
    btn.title = f.desc || '';

    const dot = document.createElement('span');
    dot.className = 'tab-dot';
    dot.style.background = val ? 'var(--accent)' : 'var(--muted)';

    const labelSpan = document.createElement('span');
    labelSpan.textContent = f.label;

    btn.appendChild(dot);
    btn.appendChild(labelSpan);

    // Clic simple → sélection
    btn.addEventListener('click', () => { activeTab = i; renderTabs(); });

    // Double-clic → renommage inline (seulement si non verrouillé)
    if (!locked) {
      btn.addEventListener('dblclick', e => {
        e.stopPropagation();
        // Remplace le bouton par un input inline
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = f.label;
        inp.style.cssText = `
          font-family: var(--font); font-size: 13px; font-weight: 500;
          padding: 2px 6px; border: 1px solid var(--accent);
          border-radius: var(--radius); outline: none;
          background: var(--surface); color: var(--text);
          width: ${Math.max(80, f.label.length * 8 + 20)}px;
          position: relative; top: 1px;
          box-shadow: var(--focus-ring);
        `;
        btn.replaceWith(inp);
        inp.focus();
        inp.select();

        const commit = () => {
          const newLabel = inp.value.trim() || f.label;
          const fi = fields.findIndex(x => x.col === f.col);
          if (fi >= 0) {
            fields[fi].label = newLabel;
            if (newLabel !== f.col) renameGristColumn(f.col, newLabel);
            saveOptions();
          }
          renderTabs();
        };
        inp.addEventListener('blur', commit);
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
          if (e.key === 'Escape') { inp.value = f.label; inp.blur(); }
        });
      });
    }

    tabsBar.appendChild(btn);
  });

  // Roue toujours visible — grisée et non interactive si verrouillé
  appendSettingsBtn();

  // Contenu
  const active = visible[activeTab];
  const val    = toString(currentRecord[active.col]);

  content.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.setAttribute('role', 'tabpanel');
  const p = document.createElement('p');
  p.className = val ? 'tab-content-text' : 'tab-content-empty';
  p.textContent = val || T.emptyField;
  panel.appendChild(p);
  content.appendChild(panel);
}

function appendSettingsBtn() {
  const isOpen = settingsPanel.classList.contains('open');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn-settings-tab' + (isOpen && !locked ? ' active' : '');
  btn.setAttribute('aria-label', 'Réglages');
  btn.setAttribute('aria-expanded', String(isOpen && !locked));

  if (locked) {
    btn.style.opacity = '.35';
    btn.style.cursor  = 'default';
    btn.title = 'Verrouillé';
    btn.setAttribute('aria-disabled', 'true');
  } else {
    btn.addEventListener('click', () => {
      const nowOpen = settingsPanel.classList.toggle('open');
      if (nowOpen) buildSettings();
      renderTabs();
    });
  }
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>`;

}

// ══════════════════════════════════════════
// PERSISTANCE — grist.setOption (config dans le document)
// ══════════════════════════════════════════
function saveOptions() {
  grist.setOption('mfvConfig', JSON.stringify({ titleCol, locked, excludedCols: [...excludedCols], fields }));
}

function loadOptions(opts) {
  if (!opts || !opts.mfvConfig) return;
  try {
    const data = JSON.parse(opts.mfvConfig);
    if (data.titleCol !== undefined)  titleCol    = data.titleCol;
    if (data.locked !== undefined)    locked      = data.locked;
    if (data.excludedCols)            excludedCols = new Set(data.excludedCols);
    if (data.fields)                  fields      = data.fields;
  } catch(e) {}
}

// ══════════════════════════════════════════
// UTILITAIRES
// ══════════════════════════════════════════
function toString(val) {
  if (val == null || val === '') return '';
  if (typeof val === 'boolean') return val ? 'true' : 'false';
  if (Array.isArray(val)) return val.join(', ');
  return String(val).trim();
}

// ══════════════════════════════════════════
// GRIST
// ══════════════════════════════════════════
let colDescriptions = {};
let colRowIdMap     = {}; // { colId: rowId }
let rowColIdMap     = {}; // { rowId: colId }

async function fetchColMeta() {
  try {
    const meta = await grist.docApi.fetchTable('_grist_Tables_column');
    if (!meta || !meta.colId) return;
    colRowIdMap = {}; rowColIdMap = {};
    meta.colId.forEach((colId, i) => {
      const desc = (meta.description[i] || '').trim();
      if (desc) colDescriptions[colId] = desc;
      colRowIdMap[colId]        = meta.id[i];
      rowColIdMap[meta.id[i]]   = colId;
    });
    // Corrige les colIds renommés dans fields via rowIds stockés
    fields.forEach(f => {
      if (f._rowId && rowColIdMap[f._rowId] && rowColIdMap[f._rowId] !== f.col) {
        f.col = rowColIdMap[f._rowId];
      }
      // Initialise _rowId si absent
      if (!f._rowId && colRowIdMap[f.col]) f._rowId = colRowIdMap[f.col];
    });
  } catch(e) {}
}

async function renameGristColumn(colId, newLabel) {
  try {
    const rowId = colRowIdMap[colId];
    if (!rowId) return;
    await grist.docApi.applyUserActions([
      ['UpdateRecord', '_grist_Tables_column', rowId, { label: newLabel }]
    ]);
  } catch(e) { console.warn('Renommage colonne Grist échoué :', e); }
}

function openSettings() {
  settingsPanel.classList.add('open');
  buildSettings();
  renderTabs();
}

grist.ready({ requiredAccess: 'full', onEditOptions: openSettings });

grist.onOptions(opts => { loadOptions(opts); renderTabs(); });

grist.onRecord(async record => {
  const firstRecord = !currentRecord;
  currentRecord = record;
  if (firstRecord) await fetchColMeta();
  else await fetchColMeta(); // recheck à chaque record pour détecter renommages
  initColsFromRecord(record);
  // Initialise _rowId sur les nouveaux champs
  fields.forEach(f => { if (!f._rowId && colRowIdMap[f.col]) f._rowId = colRowIdMap[f.col]; });
  if (fields.length === 0) {
    fields = allCols.filter(c => !excludedCols.has(c)).map(col => ({
      col, label: col, desc: colDescriptions[col] || '',
      visible: true, _rowId: colRowIdMap[col] || null
    }));
  } else {
    const existingCols = new Set(fields.map(f => f.col));
    allCols.forEach(col => {
      if (!existingCols.has(col) && !excludedCols.has(col))
        fields.push({ col, label: col, desc: colDescriptions[col] || '',
                      visible: true, _rowId: colRowIdMap[col] || null });
    });
    fields.forEach(f => {
      if (!f._descCustomized && colDescriptions[f.col]) f.desc = colDescriptions[f.col];
    });
  }
  renderTabs();
  if (settingsPanel.classList.contains('open')) buildSettings();
});
</script>
